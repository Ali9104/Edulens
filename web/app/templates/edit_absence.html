{% extends 'base.html' %}

{% block title %}Modifier une absence{% endblock %}
{% block page_title %}Modifier une absence{% endblock %}
{% block page_subtitle %}{{ absence.student.prenom }} {{ absence.student.nom }}{% endblock %}

{% block content %}

<div class="form-card">
    <form action="{{ url_for('absences.edit_absence', absence_id=absence.id) }}" method="POST">
        <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" value="{{ absence.date }}" required>
        </div>
        <div class="form-group">
            <label>Justifiée ?</label>
            <select name="justifiee" style="width:100%; padding:8px 12px; border:0.5px solid #ddd; border-radius:8px; font-size:14px;">
                <option value="0" {% if not absence.justifiee %}selected{% endif %}>Non</option>
                <option value="1" {% if absence.justifiee %}selected{% endif %}>Oui</option>
            </select>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
            <button type="submit" class="btn-primary">Enregistrer</button>
            <a href="{{ url_for('absences.list_absence') }}" class="btn-secondary">Annuler</a>
        </div>
    </form>
</div>

{% endblock %}
