{% extends 'base.html' %}

{% block title %}Modifier un étudiant{% endblock %}
{% block page_title %}Modifier un étudiant{% endblock %}
{% block page_subtitle %}Modifiez les informations{% endblock %}

{% block content %}

<div class="form-card">
    <form action="{{ url_for('students.edit_student', student_id=student.id) }}" method="POST">
        <div class="form-group">
            <label>Nom</label>
            <input type="text" name="nom" value="{{ student.nom }}" required>
        </div>
        <div class="form-group">
            <label>Prénom</label>
            <input type="text" name="prenom" value="{{ student.prenom }}" required>
        </div>
        <div class="form-group">
            <label>Groupe</label>
            <input type="text" name="groupe" value="{{ student.groupe }}" required>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
            <button type="submit" class="btn-primary">Enregistrer</button>
            <a href="{{ url_for('students.list_students') }}" class="btn-secondary">Annuler</a>
        </div>
    </form>
</div>

{% endblock %}
