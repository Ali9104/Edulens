{% extends 'base.html' %}

{% block title %}Ajouter une note{% endblock %}
{% block page_title %}Ajouter une note{% endblock %}
{% block page_subtitle %}Pour {{ student.prenom }} {{ student.nom }}{% endblock %}

{% block content %}

<div class="form-card">
    <form action="{{ url_for('grades.add_grade', student_id=student.id) }}" method="POST">
        <div class="form-group">
            <label>Matière</label>
            <input type="text" name="matiere" placeholder="Ex: Mathématiques" required>
        </div>
        <div class="form-group">
            <label>Note</label>
            <input type="number" name="note" placeholder="Ex: 14.5" min="0" max="20" step="0.25" required>
        </div>
       <div class="form-group">
    <label>Semestre</label>
    <select name="semestre" required style="width:100%; padding:8px 12px; border:0.5px solid #ddd; border-radius:8px; font-size:14px;">
        <option value="">-- Choisir --</option>
        <option value="S1">S1</option>
        <option value="S2">S2</option>
        <option value="S3">S3</option>
        <option value="S4">S4</option>
        <option value="S5">S5</option>
        <option value="S6">S6</option>
           </select>        
        </div>              
    <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" required>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
            <button type="submit" class="btn-primary">Ajouter</button>
            <a href="{{ url_for('grades.get_grades') }}" class="btn-secondary">Annuler</a>
        </div>
    </form>
</div>

{% endblock %}
