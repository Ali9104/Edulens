{% extends 'base.html' %}

{% block title %}Modifier une note{% endblock %}
{% block page_title %}Modifier une note{% endblock %}
{% block page_subtitle %}{{ grade.student.prenom }} {{ grade.student.nom }} — {{ grade.matiere }}{% endblock %}

{% block content %}

<div class="form-card">
    <form action="{{ url_for('grades.edit_grade', grade_id=grade.id) }}" method="POST">
        <div class="form-group">
            <label>Matière</label>
            <input type="text" name="matiere" value="{{ grade.matiere }}" required>
        </div>
        <div class="form-group">
            <label>Note</label>
            <input type="number" name="note" value="{{ grade.note }}" min="0" max="20" step="0.25" required>
        </div>
        <div class="form-group">
            <label>Semestre</label>
            <select name="semestre" required style="width:100%; padding:8px 12px; border:0.5px solid #ddd; border-radius:8px; font-size:14px;">
            {% for s in ['S1','S2','S3','S4','S5','S6','S7','S8','S9','S10'] %}
            <option value="{{ s }}" {% if grade.semestre == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" value="{{ grade.date }}" required>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
            <button type="submit" class="btn-primary">Enregistrer</button>
            <a href="{{ url_for('grades.get_grades') }}" class="btn-secondary">Annuler</a>
        </div>
    </form>
</div>

{% endblock %}
