{% extends 'base.html' %}

{% block title %}Ajouter un étudiant{% endblock %}
{% block page_title %}Ajouter un étudiant{% endblock %}
{% block page_subtitle %}Remplissez les informations{% endblock %}

{% block content %}

<div class="form-card">
    <form action="{{ url_for('students.add_student') }}" method="POST">
        <div class="form-group">
            <label>Nom</label>
            <input type="text" name="nom" placeholder="Ex: Benali" required>
        </div>
        <div class="form-group">
            <label>Prénom</label>
            <input type="text" name="prenom" placeholder="Ex: Youssef" required>
        </div>
        <div class="form-group">
            <label>Groupe</label>
            <input type="text" name="groupe" placeholder="Ex: Groupe A" required>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
            <button type="submit" class="btn-primary">Ajouter</button>
            <a href="{{ url_for('students.list_students') }}" class="btn-secondary">Annuler</a>
        </div>
    </form>
</div>

{% endblock %}
