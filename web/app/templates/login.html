<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLens — Connexion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f0;
        }
 
        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 1rem;
        }
 
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
 
        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 0.5rem;
        }
 
        .login-logo-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #185FA5;
        }
 
        .login-logo-text {
            font-size: 24px;
            font-weight: 500;
            color: #1a1a1a;
        }
 
        .login-subtitle {
            font-size: 14px;
            color: #888;
        }
 
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            border: 0.5px solid #e0e0e0;
            padding: 2rem;
        }
 
        .login-card h2 {
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 1.5rem;
        }
 
        .form-group {
            margin-bottom: 1rem;
        }
 
        .form-group label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 5px;
            font-weight: 500;
        }
 
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 0.5px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
 
        .form-group input:focus {
            border-color: #185FA5;
        }
 
        .btn-login {
            width: 100%;
            background: #185FA5;
            color: #fff;
            padding: 11px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s;
        }
 
        .btn-login:hover {
            background: #144e8a;
        }
 
        .login-footer {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <div class="alert alert-{{ category }}" style="margin-bottom: 1rem;">{{ message }}</div>
    {% endfor %}
    {% endwith %}
    <div class="login-wrapper">
        <div class="login-header">
            <div class="login-logo">
                <div class="login-logo-dot"></div>
                <span class="login-logo-text">EduLens</span>
            </div>
            <p class="login-subtitle">Plateforme intelligente de suivi étudiant</p>
        </div>
 
        <div class="login-card">
            <h2>Connexion</h2>
            <form action="/auth/login" method="POST">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="prof@edulens.com" name="email" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" placeholder="••••••••" name="password" required>
                </div>
                <button type="submit" class="btn-login">Se connecter</button>
            </form>
        </div>
 
    </div>
</body>
</html>
